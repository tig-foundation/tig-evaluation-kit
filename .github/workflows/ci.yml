name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Monorepo commit the smoke tests build against. Bump it deliberately after
  # checking the runner against the new commit; the separate drift job below
  # reports (without blocking) whether current monorepo main still works.
  TIG_SMOKE_MONOREPO_COMMIT: cd6090b8439ecd5b0f937c8d7bf3c35a46ff6dcb

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('tig_bench/**/*.py', 'tig_bench/templates/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Checkout the pinned monorepo snapshot for smoke tests
        run: |
          git init -q "$RUNNER_TEMP/tig-monorepo"
          git -C "$RUNNER_TEMP/tig-monorepo" remote add origin https://github.com/tig-foundation/tig-monorepo
          git -C "$RUNNER_TEMP/tig-monorepo" fetch --depth 1 origin "$TIG_SMOKE_MONOREPO_COMMIT"
          git -C "$RUNNER_TEMP/tig-monorepo" checkout -q FETCH_HEAD

      - name: Run authoritative end-to-end smoke tests
        env:
          TIG_INTEGRATION_MONOREPO: ${{ runner.temp }}/tig-monorepo
        run: python3 -m unittest tests.test_integration -v

  monorepo-main-drift:
    name: Smoke test against current monorepo main (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Checkout current monorepo main
        run: git clone --depth 1 https://github.com/tig-foundation/tig-monorepo "$RUNNER_TEMP/tig-monorepo"

      - name: Run authoritative end-to-end smoke tests
        env:
          TIG_INTEGRATION_MONOREPO: ${{ runner.temp }}/tig-monorepo
        run: python3 -m unittest tests.test_integration -v
