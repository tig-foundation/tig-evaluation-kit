name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('tig_bench/**/*.py', 'tig_bench/templates/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Checkout authoritative monorepo snapshot for smoke tests
        run: git clone --depth 1 https://github.com/tig-foundation/tig-monorepo "$RUNNER_TEMP/tig-monorepo"

      - name: Run authoritative end-to-end smoke tests
        env:
          TIG_INTEGRATION_MONOREPO: ${{ runner.temp }}/tig-monorepo
        run: python3 -m unittest tests.test_integration -v
